<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desk phone QR scanner</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0C0C0E}
a{color:#FF6A00}a:hover{color:#FF8A33}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0C0C0E; color: #FFFFFF; font-family: 'Archivo', system-ui, sans-serif; padding: 52px 16px 0">

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; bottom: 83px; background: #000000"></div>

  <header style="position: relative; display: flex; align-items: center; gap: 12px">
    <div style="width: 40px; height: 40px; border-radius: 11px; background: #FFFFFF; overflow: hidden; flex-shrink: 0"><img src="/_blob/294886e6b2eee6dab4e99c3eb05f0d84" alt="The Infinity Fitness" style="width: 100%; height: 100%; object-fit: cover; display: block"></div>
    <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
      <h1 style="margin: 0; font-size: 17px; font-weight: 800">Scan pass</h1>
      <span role="status" style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #8E8E93; white-space: nowrap"><span style="width: 6px; height: 6px; border-radius: 50%; background: #30D158"></span>Online, Ana R. on shift</span>
    </div>
    <button type="button" aria-label="Flashlight" aria-pressed="{{torchPressed}}" onClick="{{toggleTorch}}" style="width: 44px; height: 44px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; background: {{torchBg}}; border: 1px solid rgba(255,255,255,0.06); color: {{torchFg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M6 2h12l-2 7H8z"></path><path d="M8 9v13h8V9"></path><path d="M12 13v3"></path></svg></button>
  </header>

  <div role="img" aria-label="Viewfinder" style="position: absolute; top: 190px; left: 75px; width: 240px; height: 240px">
    <span aria-hidden="true" style="position: absolute; width: 32px; height: 32px; box-sizing: border-box; border: 0 solid #FFFFFF; top: 0; left: 0; border-top-width: 2px; border-left-width: 2px; border-top-left-radius: 8px"></span>
    <span aria-hidden="true" style="position: absolute; width: 32px; height: 32px; box-sizing: border-box; border: 0 solid #FFFFFF; top: 0; right: 0; border-top-width: 2px; border-right-width: 2px; border-top-right-radius: 8px"></span>
    <span aria-hidden="true" style="position: absolute; width: 32px; height: 32px; box-sizing: border-box; border: 0 solid #FFFFFF; bottom: 0; left: 0; border-bottom-width: 2px; border-left-width: 2px; border-bottom-left-radius: 8px"></span>
    <span aria-hidden="true" style="position: absolute; width: 32px; height: 32px; box-sizing: border-box; border: 0 solid #FFFFFF; bottom: 0; right: 0; border-bottom-width: 2px; border-right-width: 2px; border-bottom-right-radius: 8px"></span>
    <span aria-hidden="true" style="position: absolute; left: 14px; right: 14px; top: 119px; height: 2px; background: #FF6A00"></span>
  </div>

  <p style="position: absolute; top: 446px; left: 16px; right: 16px; margin: 0; text-align: center; font-size: 14px; font-weight: 600; color: #FFFFFF">Hold the member's pass inside the frame</p>
  <div style="position: absolute; top: 478px; left: 0; right: 0; display: flex; justify-content: center">
    <a href="Desk-Mobile-Checkin.dc.html" style="min-height: 44px; padding: 0 16px; display: inline-flex; align-items: center; font-size: 14px; font-weight: 600; color: #A1A1AA; text-decoration: underline; text-underline-offset: 3px">Type name instead</a>
  </div>

  <sc-if value="{{success}}" hint-placeholder-val="{{ true }}">
    <section role="status" aria-label="Last check-in" style="position: absolute; left: 16px; right: 16px; bottom: 99px; box-sizing: border-box; background: #17171A; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 12px">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#30D158" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1">
          <span style="font-size: 16px; font-weight: 800">Mika Santos checked in, <span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500">6:42 PM</span></span>
          <span style="font-size: 12px; color: #8E8E93">Monthly, 28 days left, <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px">INF-00482</span></span>
        </div>
        <button type="button" style="flex-shrink: 0; min-width: 56px; height: 44px; padding: 0 8px; border: 0; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">Undo</button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div role="img" aria-label="Undo available for 7 more seconds" style="height: 2px; background: #3F3F46"><div style="width: 70%; height: 2px; background: #FFFFFF"></div></div>
        <span style="font-size: 11px; color: #8E8E93">Undo within 10 seconds</span>
      </div>
    </section>
  </sc-if>

  <sc-if value="{{scanning}}" hint-placeholder-val="{{ false }}">
    <p role="status" style="position: absolute; left: 16px; right: 16px; bottom: 112px; margin: 0; text-align: center; font-size: 13px; color: #8E8E93">Looking for a pass</p>
  </sc-if>

  <nav aria-label="Desk navigation" style="position: absolute; left: 0; right: 0; bottom: 0; height: 83px; box-sizing: border-box; padding: 6px 8px 34px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; background: rgba(12,12,14,0.82); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); border-top: 0.5px solid rgba(255,255,255,0.08)">
    <a href="Desk-Mobile-Checkin.dc.html" style="min-height: 49px; color: #71717A; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 600"><span style="height: 32px; display: flex; align-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="m16 11 2 2 4-4"></path><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg></span>Check-in</a>
    <a href="Desk-Mobile-Walkin.dc.html" style="min-height: 49px; color: #71717A; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 600"><span style="height: 32px; display: flex; align-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" x2="19" y1="8" y2="14"></line><line x1="22" x2="16" y1="11" y2="11"></line></svg></span>Walk-in</a>
    <a href="Desk-Mobile-Scan.dc.html" aria-current="page" style="min-height: 49px; color: #FF6A00; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 600"><span style="width: 48px; height: 32px; border-radius: 10px; background: #FF6A00; color: #000000; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><path d="M7 12h10"></path></svg></span>Scan</a>
    <a href="Desk-Mobile-Expiry.dc.html" style="min-height: 49px; color: #71717A; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 600"><span style="height: 32px; display: flex; align-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5"></path><path d="M16 2v4"></path><path d="M8 2v4"></path><path d="M3 10h5"></path><path d="M17.5 17.5 16 16.3V14"></path><circle cx="16" cy="16" r="6"></circle></svg></span>Expiry</a>
    <a href="Desk-Mobile-Shift.dc.html" style="min-height: 49px; color: #71717A; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 600"><span style="height: 32px; display: flex; align-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="m16 3 4 4-4 4"></path><path d="M20 7H4"></path><path d="m8 21-4-4 4-4"></path><path d="M4 17h16"></path></svg></span>Shift</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["scanning","success"],"default":"success"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.props.state ?? 'success';
    const on = !!(this.state && this.state.torch);
    return {
      success: st === 'success',
      scanning: st === 'scanning',
      torchPressed: on ? 'true' : 'false',
      torchBg: on ? '#FFFFFF' : '#17171A',
      torchFg: on ? '#000000' : '#FFFFFF',
      toggleTorch: () => this.setState({ torch: !on })
    };
  }
}
</script>
</body>
</html>
