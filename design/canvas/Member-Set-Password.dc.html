<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set your password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0C0C0E}
a{color:#FFFFFF}a:hover{color:#E4E4E7}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0C0C0E; color: #FFFFFF; font-family: 'Archivo', system-ui, sans-serif; padding: 52px 20px 0">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <a href="Member-Activate.dc.html" aria-label="Back to activation code" style="width: 44px; height: 44px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; background: #17171A; border: 1px solid rgba(255,255,255,0.06); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
    <span style="font-size: 12px; font-weight: 600; color: #8E8E93">Step 2 of 2</span>
  </header>

  <h1 style="margin: 20px 0 0; font-size: 28px; line-height: 1.1; font-weight: 800; font-stretch: 112%; letter-spacing: -0.015em">Hi Jessa, set your password</h1>

  <div style="margin-top: 16px; background: #17171A; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#30D158" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>
    <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="font-size: 14px; font-weight: 700">Code accepted</span><span style="font-size: 12px; color: #8E8E93">Monthly, active Oct 18 to Nov 17</span></span>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A1A1AA">INF-00731</span>
  </div>

  <form style="margin-top: 16px; display: flex; flex-direction: column; gap: 10px">
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">New password</span>
      <span style="display: flex; align-items: center; height: 52px; box-sizing: border-box; border-radius: 16px; background: #17171A; border: 1px solid #FF6A00; padding: 0 4px 0 14px">
        <input type="password" autocomplete="new-password" value="trainbeyond26" style="flex-grow: 1; min-width: 0; height: 100%; border: 0; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 16px; outline: none">
        <button type="button" aria-label="Show password" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #8E8E93; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </span>
    </label>
    <ul aria-label="Password rules" style="list-style: none; margin: 0; padding: 0 4px; display: flex; flex-direction: column; gap: 6px; font-size: 13px">
      <sc-for list="{{rules}}" as="r" hint-placeholder-count="3">
        <li style="display: flex; align-items: center; gap: 8px; color: {{r.color}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{r.icon}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>{{r.text}}</li>
      </sc-for>
    </ul>
    <label style="display: flex; flex-direction: column; gap: 6px; margin-top: 4px">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">Confirm password</span>
      <input type="password" autocomplete="new-password" placeholder="Type it again" style="height: 52px; box-sizing: border-box; border-radius: 16px; background: #17171A; border: 1px solid rgba(255,255,255,0.06); padding: 0 14px; color: #FFFFFF; font-family: inherit; font-size: 16px">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">Email for password reset (optional)</span>
      <input type="email" autocomplete="email" placeholder="you@example.com" style="height: 52px; box-sizing: border-box; border-radius: 16px; background: #17171A; border: 1px solid rgba(255,255,255,0.06); padding: 0 14px; color: #FFFFFF; font-family: inherit; font-size: 16px">
    </label>
    <label style="display: flex; align-items: flex-start; gap: 12px; min-height: 44px; padding-top: 6px; font-size: 13px; line-height: 1.45; color: #A1A1AA; cursor: pointer">
      <input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; flex-shrink: 0; accent-color: #FFFFFF">
      <span>I have read the <a href="#" style="color: #FFFFFF; text-decoration: underline; text-underline-offset: 3px">privacy notice</a>. My data is used only for my membership (RA 10173).</span>
    </label>
  </form>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 14px 20px 34px; background: rgba(12,12,14,0.82); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); border-top: 0.5px solid rgba(255,255,255,0.08)">
    <a href="Member-Home.dc.html" style="height: 54px; border-radius: 16px; background: #FF6A00; color: #000000; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800">Activate account</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rule = (text, ok) => ({ text, color: ok ? '#FFFFFF' : '#8E8E93', icon: ok ? '#30D158' : '#48484A' });
    return {
      rules: [
        rule('At least 10 characters', true),
        rule('Includes a number', true),
        rule('Not your mobile number or member ID', true)
      ]
    };
  }
}
</script>
</body>
</html>
