<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log PT session</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0C0C0E}
a{color:#FF6A00}a:hover{color:#FF8A33}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0C0C0E; color: #FFFFFF; font-family: 'Archivo', system-ui, sans-serif; padding: 52px 16px 0">

  <header style="display: flex; align-items: center; gap: 12px">
    <a href="Coach-Clients.dc.html" aria-label="Back to clients" style="width: 44px; height: 44px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; background: #17171A; border: 1px solid rgba(255,255,255,0.06); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-size: 20px; font-weight: 800">Log PT session</h1>
      <span style="font-size: 12px; color: #8E8E93">Saturday, Oct 17</span>
    </div>
  </header>

  <section aria-label="Client" style="margin-top: 18px; background: #17171A; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 48px; height: 48px; flex-shrink: 0; box-sizing: border-box; border-radius: 14px; background: #1F1F23; border: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; color: #8E8E93">MS</span>
      <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
        <span style="font-size: 19px; font-weight: 800; font-stretch: 108%">Mika Santos</span>
        <span style="font-size: 12px; color: #8E8E93">PT 12-session package</span>
      </div>
      <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><span style="font-size: 26px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums">7</span><span style="font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #8E8E93">left</span></span>
    </div>
    <sc-if value="{{checkedIn}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; align-items: center; gap: 10px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.06)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#30D158" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>
        <span style="flex-grow: 1; font-size: 14px; font-weight: 600">Checked in today, 6:42 PM</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8E8E93">desk</span>
      </div>
    </sc-if>
    <sc-if value="{{notIn}}" hint-placeholder-val="{{ false }}">
      <div role="alert" style="display: flex; align-items: flex-start; gap: 10px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.06)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF6A00" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>
        <span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 14px; font-weight: 700">No check-in today</span><span style="font-size: 12px; line-height: 1.45; color: #A1A1AA">A session can only be logged against a same-day desk check-in. Ask Mika to check in first.</span></span>
      </div>
    </sc-if>
  </section>

  <section aria-label="Session details" style="margin-top: 12px; background: #17171A; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">Start</span>
      <button type="button" aria-label="Start time, 7:00 PM" style="height: 44px; padding: 0 14px; border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; background: #0C0C0E; color: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 15px; cursor: pointer">7:00 PM</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span id="dur" style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">Duration</span>
      <div role="radiogroup" aria-labelledby="dur" style="display: flex; gap: 4px; padding: 3px; border-radius: 14px; background: #0C0C0E; border: 1px solid rgba(255,255,255,0.06)">
        <button type="button" role="radio" aria-checked="false" style="flex: 1; height: 44px; border: 1px solid transparent; border-radius: 11px; background: transparent; color: #8E8E93; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">30 min</button>
        <button type="button" role="radio" aria-checked="false" style="flex: 1; height: 44px; border: 1px solid transparent; border-radius: 11px; background: transparent; color: #8E8E93; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">45 min</button>
        <button type="button" role="radio" aria-checked="true" style="flex: 1; height: 44px; border: 1px solid rgba(255,255,255,0.06); border-radius: 11px; background: #1F1F23; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">60 min</button>
      </div>
    </div>
    <a href="Coach-Plan.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.06); color: #FFFFFF; text-decoration: none">
      <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">Focus</span><span style="font-size: 15px; font-weight: 700">Chest + Triceps, plan Day A</span></span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#71717A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    </a>
  </section>

  <label style="margin-top: 12px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93; padding-left: 4px">Coach notes</span>
    <textarea rows="3" placeholder="Form cues, loads, how she felt" style="box-sizing: border-box; min-height: 88px; resize: none; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 12px 14px; background: #17171A; color: #FFFFFF; font-family: inherit; font-size: 15px; line-height: 1.45"></textarea>
  </label>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 14px 16px 34px; background: rgba(12,12,14,0.82); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); border-top: 0.5px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="flex-grow: 1; font-size: 13px; color: #8E8E93">After this session</span>
      <span style="width: 64px; height: 2px; background: #3F3F46"><span style="display: block; width: 50%; height: 100%; background: #FFFFFF"></span></span>
      <span style="font-size: 13px; color: #8E8E93; font-variant-numeric: tabular-nums"><span style="font-size: 16px; font-weight: 800; color: #FFFFFF">6</span> of 12 left</span>
    </div>
    <sc-if value="{{checkedIn}}" hint-placeholder-val="{{ true }}">
      <button type="button" style="width: 100%; height: 54px; border: 0; border-radius: 16px; background: #FF6A00; color: #000000; font-family: inherit; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="m9 14 2 2 4-4"></path></svg>Log session</button>
    </sc-if>
    <sc-if value="{{notIn}}" hint-placeholder-val="{{ false }}">
      <button type="button" disabled style="width: 100%; height: 54px; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; background: #1F1F23; color: #8E8E93; font-family: inherit; font-size: 15px; font-weight: 600">Waiting for check-in</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"checkin":{"editor":"enum","options":["checked-in","not-checked-in"],"default":"checked-in"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const inGym = (this.props.checkin ?? 'checked-in') === 'checked-in';
    return { checkedIn: inGym, notIn: !inGym };
  }
}
</script>
</body>
</html>
