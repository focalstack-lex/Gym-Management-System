<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coach clients</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0C0C0E}
a{color:#FF6A00}a:hover{color:#FF8A33}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0C0C0E; color: #FFFFFF; font-family: 'Archivo', system-ui, sans-serif; padding: 52px 16px 0">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">Saturday, Oct 17</span>
      <h1 style="margin: 0; font-size: 26px; font-weight: 800; font-stretch: 110%; letter-spacing: -0.01em">Coach Ramon</h1>
    </div>
    <button type="button" aria-label="Notices" style="width: 44px; height: 44px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.06); border-radius: 50%; background: #17171A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"></path><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path></svg>
    </button>
  </header>

  <section aria-label="Today at a glance" style="margin-top: 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <div style="background: #17171A; border: 1px solid rgba(255,255,255,0.06); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">Sessions</span>
      <span style="font-size: 32px; line-height: 1; font-weight: 800; font-stretch: 115%; font-variant-numeric: tabular-nums">2<span style="font-size: 14px; font-weight: 600; color: #8E8E93"> of 4</span></span>
      <div role="img" aria-label="2 of 4 sessions logged today" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
        <span style="height: 3px; border-radius: 2px; background: #FF6A00"></span>
        <span style="height: 3px; border-radius: 2px; background: #FF6A00"></span>
        <span style="height: 3px; border-radius: 2px; background: #2C2C2E"></span>
        <span style="height: 3px; border-radius: 2px; background: #2C2C2E"></span>
      </div>
    </div>
    <div style="background: #17171A; border: 1px solid rgba(255,255,255,0.06); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">In gym now</span>
      <span style="font-size: 32px; line-height: 1; font-weight: 800; font-stretch: 115%; font-variant-numeric: tabular-nums">4<span style="font-size: 14px; font-weight: 600; color: #8E8E93"> clients</span></span>
      <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: #8E8E93"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#30D158" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>From desk check-ins</span>
    </div>
  </section>

  <a href="Coach-Log.dc.html" aria-label="Up next at 7:00 PM: Mika Santos, Chest and Triceps. Log session" style="margin-top: 12px; text-decoration: none; color: #FFFFFF; background: #17171A; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 14px 14px 14px 16px; display: flex; align-items: center; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1; min-width: 0">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">Up next, 7:00 PM</span>
      <span style="font-size: 19px; font-weight: 800; font-stretch: 108%">Mika Santos</span>
      <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #8E8E93"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#30D158" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>In gym since 6:42 PM, Chest + Triceps</span>
    </div>
    <span style="width: 48px; height: 48px; flex-shrink: 0; box-sizing: border-box; border-radius: 14px; background: #1F1F23; border: 1px solid rgba(255,255,255,0.06); color: #FF6A00; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
    </span>
  </a>

  <section aria-label="My clients" style="margin-top: 12px; background: #17171A; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 12px 16px 2px">
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 6px">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">PT clients</span>
      <span style="font-size: 12px; color: #8E8E93">Sessions left</span>
    </div>
    <ul style="list-style: none; margin: 0; padding: 0">
      <sc-for list="{{clients}}" as="c" hint-placeholder-count="5">
        <li style="display: flex; align-items: center; gap: 12px; min-height: 58px; border-top: 1px solid rgba(255,255,255,0.06)">
          <span style="width: 36px; height: 36px; flex-shrink: 0; box-sizing: border-box; border-radius: 11px; background: #1F1F23; border: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: #8E8E93">{{c.initials}}</span>
          <span style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1; min-width: 0">
            <span style="font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.name}}</span>
            <span style="display: flex; align-items: center; gap: 8px">
              <span style="width: 56px; height: 2px; flex-shrink: 0; background: #3F3F46"><span style="display: block; height: 100%; width: {{c.pct}}; background: {{c.bar}}"></span></span>
              <span style="font-size: 12px; color: #8E8E93; white-space: nowrap; font-variant-numeric: tabular-nums"><span style="color: #FFFFFF; font-weight: 700">{{c.left}}</span> of {{c.total}}</span>
            </span>
          </span>
          <sc-if value="{{c.inGym}}" hint-placeholder-val="{{ true }}">
            <span style="display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #A1A1AA"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#30D158" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="In gym"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>{{c.seen}}</span>
          </sc-if>
          <sc-if value="{{c.away}}" hint-placeholder-val="{{ false }}">
            <span style="white-space: nowrap; font-size: 11px; color: #8E8E93">{{c.seen}}</span>
          </sc-if>
        </li>
      </sc-for>
    </ul>
  </section>

  <nav aria-label="Coach navigation" style="position: absolute; left: 0; right: 0; bottom: 0; height: 83px; box-sizing: border-box; padding: 6px 8px 34px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; background: rgba(12,12,14,0.82); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); border-top: 0.5px solid rgba(255,255,255,0.08)">
    <a href="Coach-Clients.dc.html" aria-current="page" style="min-height: 49px; color: #FF6A00; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 600"><span style="height: 32px; display: flex; align-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></span>Clients</a>
    <a href="Coach-Schedule.dc.html" style="min-height: 49px; color: #71717A; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 600"><span style="height: 32px; display: flex; align-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg></span>Schedule</a>
    <a href="Coach-Log.dc.html" style="min-height: 49px; color: #71717A; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 600"><span style="width: 48px; height: 32px; border-radius: 10px; background: #FF6A00; color: #000000; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="m9 14 2 2 4-4"></path></svg></span>Log</a>
    <a href="Coach-Plan.dc.html" style="min-height: 49px; color: #71717A; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 600"><span style="height: 32px; display: flex; align-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="M12 11h4"></path><path d="M12 16h4"></path><path d="M8 11h.01"></path><path d="M8 16h.01"></path></svg></span>Plans</a>
    <a href="#" style="min-height: 49px; color: #71717A; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 600"><span style="height: 32px; display: flex; align-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // Sample PT roster; in-gym state comes from the desk's same-day check-ins.
    const rows = [
      ['MS', 'Mika Santos', 7, 12, '6:42 PM'],
      ['RM', 'Rhea Mendoza', 10, 12, '6:40 PM'],
      ['CD', 'Carlo Dizon', 2, 8, '6:31 PM'],
      ['DV', 'Den Villanueva', 5, 8, '6:19 PM'],
      ['BN', 'Bea Navarro', 4, 12, null]
    ];
    const clients = rows.map(([initials, name, left, total, inAt]) => ({
      initials, name, left, total,
      pct: Math.round((left / total) * 100) + '%',
      bar: left <= 2 ? '#FF6A00' : '#FFFFFF',
      inGym: inAt !== null,
      away: inAt === null,
      seen: inAt !== null ? inAt : 'Last in Mon'
    }));
    return { clients };
  }
}
</script>
</body>
</html>
