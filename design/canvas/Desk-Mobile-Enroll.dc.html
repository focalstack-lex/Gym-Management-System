<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desk phone new member enrollment</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>

<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0C0C0E; color: #FFFFFF; font-family: 'Archivo', system-ui, sans-serif; padding: 52px 16px 0">

  <header style="display: flex; align-items: center; gap: 12px">
    <a href="Desk-Mobile-Checkin.dc.html" aria-label="Back to check-in" style="width: 44px; height: 44px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; background: #17171A; border: 1px solid rgba(255,255,255,0.06); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="m15 18-6-6 6-6"></path></svg></a>
    <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
      <h1 style="margin: 0; font-size: 20px; font-weight: 800">New member</h1>
      <span role="status" style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #8E8E93; white-space: nowrap"><span style="width: 6px; height: 6px; border-radius: 50%; background: #30D158"></span>Online, Ana R. on shift</span>
    </div>
  </header>

  <ol aria-label="Steps" style="list-style: none; margin: 16px 0 0; padding: 0; display: flex; align-items: center; gap: 8px">
    <li aria-current="step" style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; white-space: nowrap"><span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1px solid #FF6A00; color: #FF6A00; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800">1</span>Details</li>
    <li aria-hidden="true" style="flex: 1; height: 1px; background: rgba(255,255,255,0.12)"></li>
    <li style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #8E8E93; white-space: nowrap"><span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1px solid #3F3F46; display: flex; align-items: center; justify-content: center; font-size: 11px">2</span>Plan</li>
    <li aria-hidden="true" style="flex: 1; height: 1px; background: rgba(255,255,255,0.12)"></li>
    <li style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #8E8E93; white-space: nowrap"><span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1px solid #3F3F46; display: flex; align-items: center; justify-content: center; font-size: 11px">3</span>Payment</li>
  </ol>

  <form id="enroll" aria-label="Member details" style="margin: 16px 0 150px; background: #17171A; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">Full name</span>
        <input type="text" placeholder="First and last name" autocomplete="off" autocapitalize="words" style="height: 48px; box-sizing: border-box; border: 1px solid #FF6A00; border-radius: 14px; padding: 0 14px; background: #0C0C0E; color: #FFFFFF; font-family: inherit; font-size: 16px">
      </label>
    <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">Nickname</span>
        <input type="text" placeholder="What the member goes by" autocomplete="off" style="height: 48px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; padding: 0 14px; background: #0C0C0E; color: #FFFFFF; font-family: inherit; font-size: 16px">
      </label>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">Mobile</span>
      <span style="display: flex; gap: 8px">
        <span style="height: 48px; box-sizing: border-box; padding: 0 12px; border-radius: 14px; background: #1F1F23; border: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #A1A1AA">+63</span>
        <input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="10" placeholder="9XX XXX XXXX" aria-label="Mobile number after +63" style="flex: 1; min-width: 0; height: 48px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; padding: 0 14px; background: #0C0C0E; color: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 16px; letter-spacing: 0.04em">
      </span>
    </label>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; gap: 10px">
        <label style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">Birth month</span>
          <span style="position: relative; display: block">
            <select style="width: 100%; height: 48px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; padding: 0 36px 0 14px; background: #0C0C0E; color: #FFFFFF; font-family: inherit; font-size: 16px; appearance: none; -webkit-appearance: none"><option value="">Month</option><option>January</option><option>February</option><option>March</option><option>April</option><option>May</option><option>June</option><option>July</option><option>August</option><option>September</option><option>October</option><option>November</option><option>December</option></select>
            <span style="position: absolute; right: 12px; top: 0; bottom: 0; display: flex; align-items: center; pointer-events: none; color: #8E8E93"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="m6 9 6 6 6-6"></path></svg></span>
          </span>
        </label>
        <label style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">Birth day</span>
          <span style="position: relative; display: block">
            <select style="width: 100%; height: 48px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; padding: 0 36px 0 14px; background: #0C0C0E; color: #FFFFFF; font-family: inherit; font-size: 16px; appearance: none; -webkit-appearance: none"><option value="">Day</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option><option>21</option><option>22</option><option>23</option><option>24</option><option>25</option><option>26</option><option>27</option><option>28</option><option>29</option><option>30</option><option>31</option></select>
            <span style="position: absolute; right: 12px; top: 0; bottom: 0; display: flex; align-items: center; pointer-events: none; color: #8E8E93"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="m6 9 6 6 6-6"></path></svg></span>
          </span>
        </label>
      </div>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #8E8E93"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>We never ask for birth year</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.06)">
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">Emergency contact name</span>
        <input type="text" placeholder="Full name" autocomplete="off" style="height: 48px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; padding: 0 14px; background: #0C0C0E; color: #FFFFFF; font-family: inherit; font-size: 16px">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">Emergency contact mobile</span>
        <span style="display: flex; gap: 8px">
        <span style="height: 48px; box-sizing: border-box; padding: 0 12px; border-radius: 14px; background: #1F1F23; border: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #A1A1AA">+63</span>
        <input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="10" placeholder="9XX XXX XXXX" aria-label="Emergency contact mobile after +63" style="flex: 1; min-width: 0; height: 48px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; padding: 0 14px; background: #0C0C0E; color: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 16px; letter-spacing: 0.04em">
      </span>
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">Email, optional</span>
        <input type="email" placeholder="name@example.com" autocomplete="off" inputmode="email" style="height: 48px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; padding: 0 14px; background: #0C0C0E; color: #FFFFFF; font-family: inherit; font-size: 16px">
      </label>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.06)">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">Desk photo</span>
      <div style="display: flex; align-items: flex-end; gap: 14px">
        <div role="img" aria-label="No photo taken yet" style="width: 96px; height: 96px; flex-shrink: 0; box-sizing: border-box; border-radius: 16px; background: #0C0C0E; border: 1px dashed #3F3F46; display: flex; align-items: center; justify-content: center; color: #71717A"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"></path></svg></div>
        <button type="button" style="height: 48px; padding: 0 16px; box-sizing: border-box; border-radius: 14px; background: #1F1F23; border: 1px solid rgba(255,255,255,0.06); color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path><circle cx="12" cy="13" r="3"></circle></svg>Take photo</button>
      </div>
      <label style="display: flex; align-items: flex-start; gap: 12px; min-height: 44px; font-size: 14px; line-height: 1.4; font-weight: 600">
        <input type="checkbox" required style="width: 24px; height: 24px; flex-shrink: 0; margin: 0; accent-color: #FFFFFF">
        <span>Member agrees to a desk photo for check-in (RA 10173)</span>
      </label>
      <span style="font-size: 12px; line-height: 1.45; color: #8E8E93">Consent is required before a photo is taken. Without it, the photo stays empty and the member checks in by name or pass.</span>
    </div>
  </form>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 14px 16px 34px; background: rgba(12,12,14,0.82); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); border-top: 0.5px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 10px">
    <a href="Desk-Mobile-Activation.dc.html" style="height: 54px; border-radius: 16px; background: #FF6A00; color: #000000; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800">Enroll and take payment</a>
    <span style="font-size: 12px; color: #8E8E93; text-align: center">Step 1 of 3. Plan and payment come next.</span>
  </div>
</div>
</x-dc>
