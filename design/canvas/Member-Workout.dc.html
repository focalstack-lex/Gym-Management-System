<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workout log</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0C0C0E}
a{color:#FF6A00}a:hover{color:#FF8A33}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0C0C0E; color: #FFFFFF; font-family: 'Archivo', system-ui, sans-serif; padding: 52px 20px 0">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <a href="Member-Home.dc.html" aria-label="Back to today" style="width: 44px; height: 44px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; background: #17171A; border: 1px solid rgba(255,255,255,0.06); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px">
      <h1 style="margin: 0; font-size: 17px; font-weight: 700">Push day</h1>
      <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93"><span style="width: 6px; height: 6px; border-radius: 50%; background: #FF6A00"></span>Recording</span>
    </div>
    <button type="button" aria-label="Workout options" style="width: 44px; height: 44px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.06); border-radius: 50%; background: #17171A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg></button>
  </header>

  <section aria-label="Session totals" style="margin-top: 16px; background: #17171A; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
      <div style="display: flex; flex-direction: column; gap: 5px">
        <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">Time</span>
        <span style="font-size: 26px; line-height: 1; font-weight: 800; font-stretch: 112%; font-variant-numeric: tabular-nums">42:18</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px; padding-left: 14px; border-left: 1px solid rgba(255,255,255,0.06)">
        <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">Volume</span>
        <span style="font-size: 26px; line-height: 1; font-weight: 800; font-stretch: 112%; font-variant-numeric: tabular-nums">1,610<span style="font-size: 12px; font-weight: 600; color: #8E8E93"> kg</span></span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px; padding-left: 14px; border-left: 1px solid rgba(255,255,255,0.06)">
        <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">Sets</span>
        <span style="font-size: 26px; line-height: 1; font-weight: 800; font-stretch: 112%; font-variant-numeric: tabular-nums">3<span style="font-size: 14px; font-weight: 600; color: #8E8E93">/10</span></span>
      </div>
    </div>
    <div role="img" aria-label="3 of 10 planned sets done" style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px">
      <span style="height: 4px; border-radius: 1px; background: #FFFFFF"></span>
      <span style="height: 4px; border-radius: 1px; background: #FFFFFF"></span>
      <span style="height: 4px; border-radius: 1px; background: #FFFFFF"></span>
      <span style="height: 4px; border-radius: 1px; background: #3F3F46"></span>
      <span style="height: 4px; border-radius: 1px; background: #3F3F46; margin-right: 4px"></span>
      <span style="height: 4px; border-radius: 1px; background: #3F3F46"></span>
      <span style="height: 4px; border-radius: 1px; background: #3F3F46"></span>
      <span style="height: 4px; border-radius: 1px; background: #3F3F46; margin-right: 4px"></span>
      <span style="height: 4px; border-radius: 1px; background: #3F3F46"></span>
      <span style="height: 4px; border-radius: 1px; background: #3F3F46"></span>
    </div>
  </section>

  <section aria-label="Bench press" style="margin-top: 12px; background: #17171A; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
        <h2 style="margin: 0; font-size: 18px; font-weight: 800">Bench press</h2>
        <span style="font-size: 12px; color: #8E8E93">Barbell, 3 of 4 sets</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <svg width="28" height="28" viewBox="0 0 28 28" role="img" aria-label="Rest timer, 1 minute 24 seconds left of 2 minutes" style="display: block; transform: rotate(-90deg)">
          <circle cx="14" cy="14" r="12" fill="none" stroke="#3F3F46" stroke-width="2"></circle>
          <circle cx="14" cy="14" r="12" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="52.8 75.4"></circle>
        </svg>
        <span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums">1:24</span><span style="font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">Rest</span></span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 34px minmax(0, 1fr) 64px 64px 44px; gap: 8px; align-items: center; padding: 0 2px; font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">
      <span>Set</span><span>Previous</span><span style="text-align: center">Kg</span><span style="text-align: center">Reps</span><span></span>
    </div>

    <div style="display: grid; grid-template-columns: 34px minmax(0, 1fr) 64px 64px 44px; gap: 8px; align-items: center; height: 44px; padding: 0 2px; font-variant-numeric: tabular-nums">
      <span style="font-size: 15px; font-weight: 700; color: #8E8E93">1</span>
      <span style="font-size: 13px; color: #8E8E93">60 x 10</span>
      <span style="text-align: center; font-size: 16px; font-weight: 700">60</span>
      <span style="text-align: center; font-size: 16px; font-weight: 700">10</span>
      <button type="button" aria-label="Set 1 done" aria-pressed="true" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; color: #000000; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span></button>
    </div>
    <div style="display: grid; grid-template-columns: 34px minmax(0, 1fr) 64px 64px 44px; gap: 8px; align-items: center; height: 44px; padding: 0 2px; font-variant-numeric: tabular-nums">
      <span style="font-size: 15px; font-weight: 700; color: #8E8E93">2</span>
      <span style="font-size: 13px; color: #8E8E93">70 x 8</span>
      <span style="text-align: center; font-size: 16px; font-weight: 700">70</span>
      <span style="text-align: center; font-size: 16px; font-weight: 700">8</span>
      <button type="button" aria-label="Set 2 done" aria-pressed="true" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; color: #000000; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span></button>
    </div>
    <div style="display: grid; grid-template-columns: 34px minmax(0, 1fr) 64px 64px 44px; gap: 8px; align-items: center; height: 44px; padding: 0 2px; font-variant-numeric: tabular-nums">
      <span style="font-size: 15px; font-weight: 700; color: #8E8E93">3</span>
      <span style="font-size: 13px; color: #8E8E93">75 x 6</span>
      <span style="text-align: center; font-size: 16px; font-weight: 700">75</span>
      <span style="text-align: center; font-size: 16px; font-weight: 700">6</span>
      <button type="button" aria-label="Set 3 done" aria-pressed="true" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; color: #000000; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span></button>
    </div>
    <div style="display: grid; grid-template-columns: 34px minmax(0, 1fr) 64px 64px 44px; gap: 8px; align-items: center; min-height: 52px; padding: 4px 2px; border-radius: 14px; background: #1F1F23; border: 1px solid rgba(255,255,255,0.06); font-variant-numeric: tabular-nums">
      <span style="font-size: 15px; font-weight: 800; color: #FFFFFF; padding-left: 6px">4</span>
      <span style="font-size: 13px; color: #8E8E93">75 x 6</span>
      <input type="text" inputmode="decimal" aria-label="Set 4 weight in kg" value="75" style="width: 100%; box-sizing: border-box; height: 44px; border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; background: #0C0C0E; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; text-align: center">
      <input type="text" inputmode="numeric" aria-label="Set 4 reps" placeholder="6" style="width: 100%; box-sizing: border-box; height: 44px; border: 1px solid #FF6A00; border-radius: 12px; background: #0C0C0E; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; text-align: center">
      <button type="button" aria-label="Mark set 4 done" aria-pressed="false" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #71717A"></span></button>
    </div>

    <button type="button" style="height: 44px; border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>Add set
    </button>
  </section>

  <button type="button" aria-label="Incline dumbbell press, 0 of 3 sets" style="margin-top: 10px; width: 100%; min-height: 60px; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; background: #17171A; color: #FFFFFF; font-family: inherit; padding: 0 16px; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
    <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">Incline dumbbell press</span><span style="font-size: 12px; color: #8E8E93">0 of 3 sets</span></span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#71717A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
  </button>
  <button type="button" aria-label="Cable triceps pushdown, 0 of 3 sets" style="margin-top: 10px; width: 100%; min-height: 60px; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; background: #17171A; color: #FFFFFF; font-family: inherit; padding: 0 16px; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
    <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">Cable triceps pushdown</span><span style="font-size: 12px; color: #8E8E93">0 of 3 sets</span></span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#71717A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
  </button>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 28px; background: #0C0C0E; border-top: 1px solid rgba(255,255,255,0.06); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 12px">
    <button type="button" style="height: 52px; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; background: #1F1F23; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Add exercise</button>
    <a href="Member-Share.dc.html" style="height: 52px; border-radius: 16px; background: #FF6A00; color: #000000; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800">Finish workout</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
