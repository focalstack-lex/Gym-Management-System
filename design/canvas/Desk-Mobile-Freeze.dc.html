    </div>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8E8E93">INF-00482</span>

  <form aria-label="Freeze request" style="margin-top: 12px; background: #17171A; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px">

      <input type="date" value="2026-10-17" style="height: 48px; box-sizing: border-box; border: 1px solid #FF6A00; border-radius: 14px; padding: 0 14px; background: #0C0C0E; color: #FFFFFF; color-scheme: dark; font-family: inherit; font-size: 16px">
      <span style="font-size: 12px; color: #8E8E93">Today, Sat Oct 17</span>
    </label>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span id="len" style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">Length</span>

      </div>
    </div>
    <div style="display: flex">
        <label style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px">

          <span style="position: relative; display: block">
            <select style="width: 100%; height: 48px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; padding: 0 36px 0 14px; background: #0C0C0E; color: #FFFFFF; font-family: inherit; font-size: 16px; appearance: none; -webkit-appearance: none"><option value="">Select reason</option><option selected>Travel</option><option>Injury</option><option>Work</option><option>Other</option></select>
            <span style="position: absolute; right: 12px; top: 0; bottom: 0; display: flex; align-items: center; pointer-events: none; color: #8E8E93"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="m6 9 6 6 6-6"></path></svg></span>
          </span>
        </label>
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">Note</span>
        <input type="text" placeholder="Optional, for the owner" autocomplete="off" style="height: 48px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; padding: 0 14px; background: #0C0C0E; color: #FFFFFF; font-family: inherit; font-size: 16px">
      </label>
  </form>

  <section aria-label="Coverage preview" style="margin-top: 12px; background: #17171A; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">Preview</span>
    <span style="font-size: 18px; line-height: 1.2; font-weight: 800; font-stretch: 105%">Coverage moves from Nov 14 to Nov 28</span>
    <div role="img" aria-label="Frozen 14 days from Oct 17, then coverage resumes through Nov 28" style="display: flex; gap: 2px; height: 2px">
      <span style="flex: 14 1 0; background: #64D2FF"></span>
      <span style="flex: 28 1 0; background: #FFFFFF"></span>

    <div style="display: flex; justify-content: space-between; gap: 12px; font-size: 11px; color: #8E8E93; font-variant-numeric: tabular-nums"><span>Oct 17</span><span>Oct 31</span><span>Nov 28</span></div>

  </section>

  <div style="margin-top: 12px; padding-bottom: 130px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #1F1F23; border: 1px solid rgba(255,255,255,0.06)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg><span style="font-size: 13px; line-height: 1.45; color: #A1A1AA"><span style="color: #FFFFFF; font-weight: 700">Approval.</span> Backdated freezes need owner approval.</span></div>
    <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #1F1F23; border: 1px solid rgba(255,255,255,0.06)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg><span style="font-size: 13px; line-height: 1.45; color: #A1A1AA"><span style="color: #FFFFFF; font-weight: 700">Online only.</span> Freezes are not allowed while the desk is offline.</span></div>

    <button type="button" style="height: 54px; border: 0; border-radius: 16px; background: #FF6A00; color: #000000; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer">Submit freeze request</button>
  </div>
