<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Staff PIN sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0C0C0E}
a{color:#FFFFFF}a:hover{color:#E4E4E7}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0C0C0E; color: #FFFFFF; font-family: 'Archivo', system-ui, sans-serif; padding: 52px 20px 0">

  <header style="display: flex; align-items: center; gap: 12px">
    <div style="width: 40px; height: 40px; border-radius: 11px; background: #FFFFFF; overflow: hidden; flex-shrink: 0"><img src="/_blob/294886e6b2eee6dab4e99c3eb05f0d84" alt="The Infinity Fitness" style="width: 100%; height: 100%; object-fit: cover; display: block"></div>
    <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
      <span style="font-size: 17px; font-weight: 800">Front desk phone</span>
      <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #8E8E93"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>Registered desk device <span style="font-family: 'JetBrains Mono', monospace">DSK-02</span></span>
    </div>
  </header>

  <h1 style="margin: 26px 0 0; font-size: 26px; font-weight: 800; font-stretch: 110%; letter-spacing: -0.01em">Who is at the desk?</h1>

  <div role="radiogroup" aria-label="Staff member" style="margin-top: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{staff}}" as="s" hint-placeholder-count="2">
      <button type="button" role="radio" aria-checked="{{s.checked}}" onClick="{{s.pick}}" style="min-height: 64px; box-sizing: border-box; border: {{s.border}}; border-radius: 18px; background: #17171A; color: #FFFFFF; font-family: inherit; text-align: left; padding: 0 14px; display: flex; align-items: center; gap: 12px; cursor: pointer">
        <span style="width: 36px; height: 36px; flex-shrink: 0; box-sizing: border-box; border-radius: 11px; background: #1F1F23; border: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: #8E8E93">{{s.initials}}</span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">{{s.name}}</span><span style="font-size: 11px; color: #8E8E93">{{s.role}}</span></span>
      </button>
    </sc-for>
  </div>

  <div style="margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 12px">
    <span style="font-size: 13px; color: #8E8E93">Enter your 6-digit PIN</span>
    <div role="img" aria-label="{{pinLabel}}" style="display: flex; gap: 14px">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="6"><span style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 50%; background: {{d.bg}}; border: 1.5px solid {{d.ring}}"></span></sc-for>
    </div>
  </div>

  <div style="margin: 22px auto 0; width: 300px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="11">
      <button type="button" aria-label="{{k.label}}" onClick="{{k.press}}" style="height: 60px; border: {{k.border}}; border-radius: 18px; background: {{k.bg}}; color: #FFFFFF; font-family: inherit; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; cursor: pointer; visibility: {{k.visibility}}">{{k.text}}</button>
    </sc-for>
    <button type="button" aria-label="Delete last digit" onClick="{{del}}" style="height: 60px; border: 0; border-radius: 18px; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"></path><path d="m12 9 6 6"></path><path d="m18 9-6 6"></path></svg></button>
  </div>

  <div style="margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center">
    <a href="#" style="min-height: 44px; display: inline-flex; align-items: center; font-size: 13px; font-weight: 600; color: #A1A1AA; text-decoration: none">Forgot your PIN? The owner can reset it.</a>
    <span style="font-size: 12px; color: #8E8E93">5 wrong tries lock this device for 5 minutes.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const who = s.who ?? 0;
    const pin = s.pin ?? 4;
    const people = [['AR', 'Ana R.', 'Front desk'], ['JM', 'Joel M.', 'Relief']];
    const staff = people.map(([initials, name, role], i) => ({
      initials, name, role,
      checked: i === who ? 'true' : 'false',
      border: i === who ? '1px solid #FF6A00' : '1px solid rgba(255,255,255,0.06)',
      pick: () => this.setState({ who: i, pin: 0 })
    }));
    const dots = [0, 1, 2, 3, 4, 5].map((i) => ({ bg: i < pin ? '#FFFFFF' : 'transparent', ring: i < pin ? '#FFFFFF' : '#3F3F46' }));
    const digit = (n) => ({ text: String(n), label: String(n), bg: '#17171A', border: '1px solid rgba(255,255,255,0.06)', visibility: 'visible', press: () => this.setState({ pin: Math.min(6, pin + 1) }) });
    const keys = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(digit);
    keys.push({ text: '', label: 'Empty', bg: 'transparent', border: '0', visibility: 'hidden', press: () => {} });
    keys.push(digit(0));
    const del = () => this.setState({ pin: Math.max(0, pin - 1) });
    return { staff, dots, keys, del, pinLabel: pin + ' of 6 digits entered' };
  }
}
</script>
</body>
</html>
