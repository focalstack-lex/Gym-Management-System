<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  qrCells() {
    // Placeholder pattern shaped like a QR code; the real code is generated from the member ID at build time.
    const n = 25;
    let seed = 482;
    const rand = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
    const finder = (r, c) => {
      const origins = [[0, 0], [0, n - 7], [n - 7, 0]];
      for (const [r0, c0] of origins) {
        const dr = r - r0, dc = c - c0;
        if (dr >= -1 && dr <= 7 && dc >= -1 && dc <= 7) {
          if (dr < 0 || dr > 6 || dc < 0 || dc > 6) return 0;
          const ring = Math.min(dr, dc, 6 - dr, 6 - dc);
          return ring === 1 ? 0 : 1;
        }
      }
      return -1;
    };
    const cells = [];
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        let on = finder(r, c);
        if (on === -1) {
          if (r === 6) on = c % 2 === 0 ? 1 : 0;
          else if (c === 6) on = r % 2 === 0 ? 1 : 0;
          else on = rand() > 0.52 ? 1 : 0;
        }
        cells.push({ bg: on ? '#000000' : '#FFFFFF' });
      }
    }
    return cells;
  }
  renderVals() {
    if (!this._cells) this._cells = this.qrCells();
    return { cells: this._cells };
  }
}
</script>
