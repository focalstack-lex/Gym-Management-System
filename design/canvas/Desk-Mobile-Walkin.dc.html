<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desk phone walk-in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0C0C0E}
a{color:#FF6A00}a:hover{color:#FF8A33}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0C0C0E; color: #FFFFFF; font-family: 'Archivo', system-ui, sans-serif; padding: 52px 16px 0">

  <header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">Saturday, Oct 17</span>
      <h1 style="margin: 0; font-size: 26px; font-weight: 800; font-stretch: 110%; letter-spacing: -0.01em">Walk-in</h1>
    </div>
    <span style="font-size: 13px; color: #8E8E93; padding-bottom: 4px; font-variant-numeric: tabular-nums"><span style="font-size: 20px; font-weight: 800; color: #FFFFFF">9</span> today</span>
  </header>

  <form aria-label="Record walk-in" style="margin-top: 16px; background: #17171A; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">Visitor name</span>
      <input type="text" autocomplete="off" placeholder="First and last name" style="height: 48px; box-sizing: border-box; border: 1px solid #FF6A00; border-radius: 14px; padding: 0 14px; background: #0C0C0E; color: #FFFFFF; font-family: inherit; font-size: 16px">
    </label>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span id="pay-mode" style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">Payment</span>
      <div role="radiogroup" aria-labelledby="pay-mode" style="display: flex; gap: 4px; padding: 3px; border-radius: 14px; background: #0C0C0E; border: 1px solid rgba(255,255,255,0.06)">
        <button type="button" role="radio" aria-checked="false" style="flex: 1; height: 44px; border: 1px solid transparent; border-radius: 11px; background: transparent; color: #8E8E93; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Cash</button>
        <button type="button" role="radio" aria-checked="true" style="flex: 1; height: 44px; border: 1px solid rgba(255,255,255,0.06); border-radius: 11px; background: #1F1F23; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">GCash</button>
        <button type="button" role="radio" aria-checked="false" style="flex: 1; height: 44px; border: 1px solid transparent; border-radius: 11px; background: transparent; color: #8E8E93; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Maya</button>
      </div>
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">GCash reference no.</span>
      <input type="text" inputmode="numeric" placeholder="13 digits" style="height: 48px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; padding: 0 14px; background: #0C0C0E; color: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 16px; letter-spacing: 0.06em">
    </label>
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.06)">
      <span style="font-size: 14px; color: #8E8E93">Walk-in rate</span>
      <span style="font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums">PHP [RATE]</span>
    </div>
    <button type="submit" style="height: 56px; border: 0; border-radius: 16px; background: #FF6A00; color: #000000; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer">Record walk-in</button>
  </form>

  <a href="Desk-Mobile-Convert.dc.html" style="margin-top: 12px; text-decoration: none; color: #FFFFFF; background: #17171A; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
    <span style="width: 36px; height: 36px; flex-shrink: 0; box-sizing: border-box; border-radius: 10px; background: #1F1F23; border: 1px solid rgba(255,255,255,0.06); color: #8E8E93; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg></span>
    <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
      <span style="font-size: 14px; font-weight: 700">Convert to membership</span>
      <span style="font-size: 12px; color: #8E8E93">Today's walk-in fee counts toward a plan</span>
    </span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#71717A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
  </a>

  <section aria-label="Today's walk-ins" style="margin-top: 12px; background: #17171A; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 12px 16px 4px">
    <span style="display: block; padding-bottom: 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8E8E93">Latest</span>
    <ol style="list-style: none; margin: 0; padding: 0">
      <li style="display: flex; align-items: center; gap: 10px; min-height: 44px; border-top: 1px solid rgba(255,255,255,0.06); white-space: nowrap"><span style="width: 58px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8E8E93">6:38 PM</span><span style="flex-grow: 1; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis">Jessa Lim</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #A1A1AA">GCash 4402</span></li>
      <li style="display: flex; align-items: center; gap: 10px; min-height: 44px; border-top: 1px solid rgba(255,255,255,0.06); white-space: nowrap"><span style="width: 58px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8E8E93">5:52 PM</span><span style="flex-grow: 1; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis">Paul Garcia</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #A1A1AA">Cash</span></li>    </ol>
  </section>

  <nav aria-label="Desk navigation" style="position: absolute; left: 0; right: 0; bottom: 0; height: 83px; box-sizing: border-box; padding: 6px 8px 34px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; background: rgba(12,12,14,0.82); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); border-top: 0.5px solid rgba(255,255,255,0.08)">
    <a href="Desk-Mobile-Checkin.dc.html" style="min-height: 49px; color: #71717A; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 600"><span style="height: 32px; display: flex; align-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 11 2 2 4-4"></path><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg></span>Check-in</a>
    <a href="Desk-Mobile-Walkin.dc.html" aria-current="page" style="min-height: 49px; color: #FF6A00; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 600"><span style="height: 32px; display: flex; align-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" x2="19" y1="8" y2="14"></line><line x1="22" x2="16" y1="11" y2="11"></line></svg></span>Walk-in</a>
    <a href="Desk-Mobile-Scan.dc.html" style="min-height: 49px; color: #71717A; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 600"><span style="width: 48px; height: 32px; border-radius: 10px; background: #FF6A00; color: #000000; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><path d="M7 12h10"></path></svg></span>Scan</a>
    <a href="Desk-Mobile-Expiry.dc.html" style="min-height: 49px; color: #71717A; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 600"><span style="height: 32px; display: flex; align-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5"></path><path d="M16 2v4"></path><path d="M8 2v4"></path><path d="M3 10h5"></path><path d="M17.5 17.5 16 16.3V14"></path><circle cx="16" cy="16" r="6"></circle></svg></span>Expiry</a>
    <a href="Desk-Mobile-Shift.dc.html" style="min-height: 49px; color: #71717A; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 600"><span style="height: 32px; display: flex; align-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 3 4 4-4 4"></path><path d="M20 7H4"></path><path d="m8 21-4-4 4-4"></path><path d="M4 17h16"></path></svg></span>Shift</a>
  </nav>
</div>
</x-dc>
